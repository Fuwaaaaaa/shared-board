<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>みんなのボード</title>
    <meta name="description" content="ホワイトボード・カレンダー・リマインドをみんなで共有するボード" />
    <!-- 付箋に書いた数字を iOS が電話番号のリンクに変えてしまうのを止める -->
    <meta name="format-detection" content="telephone=no" />

    <!--
      リンクを送って使うアプリなので、共有したときのカードは本体機能のうち。
      画像は public/og-image.png（1200×630、OG の標準寸法）。
      相対パスにしてあるのは、配信先のドメインを決め打ちしないため。
      Slack・Discord・X・LINE は解決してくれるが、Facebook のように
      絶対 URL を要求するところに出すなら、ドメインを持つ変数が要る。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="みんなのボード" />
    <meta property="og:title" content="みんなのボード" />
    <meta
      property="og:description"
      content="ホワイトボード・カレンダー・リマインドをみんなで共有するボード"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="みんなのボードの紹介画像" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ボード" />
    <!-- viewport-fit=cover と組みで、iOS のホーム画面から開いたときに全画面になる -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      開いた直後に匿名サインインで Supabase へ繋ぎに行くので、
      名前解決と TLS の握手を先に済ませておく。
      CORS 越しの通信なので crossorigin を付けないと別の接続になり、意味がなくなる。
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <style>
      /* 読み込み中の表示。React が #root の中身ごと置き換えるので後片付けは要らない */
      .boot {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        font-family:
          'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, -apple-system,
          'Segoe UI', sans-serif;
        color: #64748b;
        font-size: 14px;
      }
      /* 動きを減らす設定の人には点滅させない */
      @media (prefers-reduced-motion: no-preference) {
        .boot {
          animation: boot-fade 1.2s ease-in-out infinite alternate;
        }
        @keyframes boot-fade {
          from {
            opacity: 0.35;
          }
          to {
            opacity: 1;
          }
        }
      }
      .fallback {
        max-width: 34rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        font-family:
          'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, -apple-system,
          'Segoe UI', sans-serif;
        line-height: 1.8;
        color: #1e293b;
      }
      .fallback h1 {
        font-size: 1.25rem;
      }
      .fallback p {
        color: #475569;
      }
    </style>
    <noscript>
      <!-- JavaScript が無いと中身は出ないので、読み込み中の表示は消して案内だけ見せる -->
      <style>
        #root {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="boot">読み込み中…</div>
    </div>

    <noscript>
      <div class="fallback">
        <h1>みんなのボード</h1>
        <p>
          このページを表示するには JavaScript が必要です。ブラウザの設定で JavaScript
          を有効にしてから、もう一度開いてください。
        </p>
        <p>
          ホワイトボード・カレンダー・リマインドを、ログインなしでみんなと共有できるボードです。
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
