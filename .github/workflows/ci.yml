# みんなのボード — 自動テスト
#
# 手元でやっている検証を、そのまま押したときに回す。
#
#   1. checks  … lint / tsc / vitest / Edge Function（Deno）。数分で返る
#   2. backend … Supabase を立てて pgTAP と Playwright
#
# Edge Function を backend ではなく checks に入れてあるのは、Supabase を
# 立てずに走るため。テストは fetch を差し替えて handler を直接呼ぶので、
# DB もネットワークも要らない（supabase/functions/tests/helpers.ts）。
# deno は devDependency なので、npm ci で入る版がそのまま手元と揃う。
#
# backend を 1 つのジョブにまとめてあるのは、supabase start が
# 10 個ほどの image を取ってくるため。pgTAP と E2E で 2 回払うより、
# 立てたスタックを使い回すほうが安い。順番は pgTAP が先——
# スキーマが壊れているときの E2E の赤は読む価値がないので、先に落とす。
#
# 引き金を push だけにしてあるのは、pull_request も足すと同じ commit を
# 2 回走らせるため。fork からの PR を受けるようになったら足す。
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

# 同じ枝を続けて push したら、前の実行は捨てる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint / 型 / 単体テスト / Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # build は tsc --noEmit を含む。型だけでなく、実際に束ねられることも見る
      - name: 型と build
        run: npm run build

      - name: 単体テスト（node / jsdom）
        run: npm test

      # esm.sh と npm: から取ってくるぶんを持ち越す。
      # 鍵は deno.lock なので、依存を上げたときだけ取り直しになる
      - name: Deno のキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      # tsc は supabase/ を見ていない（tsconfig.json の include にない）。
      # Edge Function の型はここでしか見ていないので、テストの前に通す
      - name: Edge Function の型
        run: npm run check:functions

      - name: Edge Function のテスト（Deno）
        run: npm run test:functions

  backend:
    name: 権限（pgTAP）とブラウザ（Playwright）
    runs-on: ubuntu-latest
    # 手元での初回は image の取得込みで数分かかる。CI では余裕を持たせる
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Supabase CLI は devDependency で、package.json に版を完全固定してある。
      # setup-cli の action を使うと版の定義元が package.json と CI の 2 か所になり、
      # 手元と CI で違う版が動いていても誰も気づけない。npm ci で入るものを使う。
      - name: Supabase を立てる
        run: npx supabase start

      # このリポジトリに supabase/migrations はない。DB は冪等な schema.sql 1 本で、
      # 手元では SQL Editor に貼って適用している（docs/SETUP.md）。
      # ここでは同じものを、立てた DB の postgres へそのまま流す。
      # ON_ERROR_STOP=1 なので、途中で 1 つでもエラーが出れば赤くなる。
      # コンテナ名の末尾は supabase/config.toml の project_id。
      - name: schema.sql を流す
        run: |
          docker exec -i supabase_db_shared-board \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/schema.sql

      # 冪等であることを、毎回ここで確かめる。2 回目で落ちたら
      # 「create table if not exists」を書き忘れたということ
      - name: schema.sql をもう一度流す（冪等の確認）
        run: |
          docker exec -i supabase_db_shared-board \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/schema.sql

      - name: 権限のテスト（pgTAP）
        run: npx supabase test db

      # 手元の .env.local は git に入れていないので、ここで作る。
      # ローカルの anon key は誰の環境でも同じ既定値で、秘密ではない。
      - name: .env.local を作る
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "$API_URL" "$ANON_KEY" > .env.local

      # Chromium は全部、Firefox / WebKit は @smoke だけを走らせる
      # （振り分けは playwright.config.ts の projects）
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium firefox webkit

      # CI では e2e/global-setup.ts が「つながらない」を握りつぶさず落とす。
      # 飛ばして緑になると、通ったのか何も走らなかったのか分からないため
      - name: ブラウザのテスト（Playwright）
        run: npm run test:e2e

      # trace: 'on-first-retry' と video: 'retain-on-failure' の出力先。
      # pgTAP で落ちたときは何も無いので、無くても怒らせない
      - name: 失敗したときの記録（trace / 動画）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
